[package]
name = "douyin-tool"
version = "0.1.0"
description = "Douyin video downloader"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "douyin_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies", "gzip"] }
futures-util = "0.3"
regex = "1"
percent-encoding = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
