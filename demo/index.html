<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>短视频下载工具</title>
    <script>
      // 首屏前恢复主题，避免深色/浅色闪烁
      try {
        document.documentElement.dataset.theme = localStorage.getItem("dy-theme") || "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <style>
      html { background: #0b0d13; }
      html[data-theme="light"] { background: #f3f5f9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
